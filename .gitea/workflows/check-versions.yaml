name: Check versions

on:
  workflow_dispatch:
  schedule:
    - cron: "15 5 * * *"
    - cron: "15 17 * * *"

jobs:
  check-versions:
    runs-on: ubuntu-latest
    container:
      image: registry.mkz.me/mycroft/golang-cdk8s@sha256:df68b2ff94a286e691c903093327936fde0f4cbe881d07cacbbac8bf1a9e0454 # build-2521
      pull: always
    steps:
      - name: Check out repository code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build cdk8s charts
        run: |
          cdk8s --version
          ls -l
          cdk8s import
          git diff
          git checkout cdk8s.yaml
          cdk8s synth
      - name: Build k8s-home binary
        run: |
          go build -o . ./...
      - name: Check versions
        run: |
          ./k8s-home check-versions
      - name: Create PRs for outdated versions
        env:
          GITEA_TOKEN: ${{ secrets.TOKEN }}
        run: |
          ./k8s-home create-prs
