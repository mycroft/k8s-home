name: Go Linting

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'versions.yaml'

jobs:
  golangci-lint:
    name: Run golangci-lint
    runs-on: ubuntu-latest
    container:
      image: registry.mkz.me/mycroft/golang-cdk8s@sha256:b3a328f19a097bb4a2a2d6eac2977c112356ae8549e568f6a9cb063a873689e3 # build-3178
      pull: always

    steps:
      - name: Check out repository code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Install golangci-lint
        run: |
          if ! command -v golangci-lint &> /dev/null; then
            echo "Installing golangci-lint..."
            go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
            export PATH=$PATH:$(go env GOPATH)/bin
          fi
          golangci-lint --version

      - name: Verify Go version
        run: |
          echo "Go version:"
          go version
          echo "Go environment:"
          go env GOARCH GOOS GOPATH

      - name: Build cdk8s charts
        run: |
          echo "Golang version:"
          go version
          echo "cdk8s version:"
          cdk8s --version
          cdk8s import
          cdk8s synth

      - name: Install conftest
        run: |
          if ! command -v conftest &> /dev/null; then
            echo "Installing conftest..."
            go install github.com/open-policy-agent/conftest@latest
          fi
          export PATH=$PATH:$(go env GOPATH)/bin
          conftest --version

      - name: Run conftest policies
        run: |
          echo "Running conftest policies on generated charts..."
          export PATH=$PATH:$(go env GOPATH)/bin
          conftest test --policy policies --data policies/exemptions.yaml --data policies/policy.yaml ./dist

      - name: Install kustomize
        run: |
          # v5.8.1 embeds kustomize/api v0.21.1, the version Flux's
          # kustomize-controller v1.8.2 builds with.
          go install sigs.k8s.io/kustomize/kustomize/v5@v5.8.1
          export PATH=$PATH:$(go env GOPATH)/bin
          kustomize version

      - name: Build manifests the way Flux does
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          sh contrib/kustomize-build.sh

      - name: Run golangci-lint
        run: |
          echo "Running golangci-lint on Go code..."
          golangci-lint run -v --timeout=5m --config=.golangci.yaml ./...

      - name: Run Go tests
        run: |
          # Needs imports/ from the cdk8s import above; tests that build cdk8s
          # objects drive jsii through the image's node.
          go test ./...

      - name: Report status
        if: ${{ always() }}
        run: |
          if [ "${{ job.status }}" = "failure" ]; then
            echo "❌ golangci-lint found issues that need to be fixed."
            echo "Please fix the issues before merging to main."
            exit 1
          else
            echo "✅ golangci-lint passed successfully!"
          fi
