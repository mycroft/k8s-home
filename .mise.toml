[tools]
golang = "1.27.2"
golangci-lint = { version = "2.14.0", depends = "golang" }
node = "24"
"npm:cdk8s-cli" = { version = "2.207.65", depends = "node", trust_policy_excludes = ["jsii@5.9.55"] }

[tasks.import]
description = "cdk8s import"
run = "cdk8s import"

[tasks.synth]
description = "cdk8s synth"
run = "cdk8s synth"

[tasks.build]
description = "Build the k8s-home binary"
run = "go build -o . ./..."
sources = ["charts/**/*", "internal/**/*", "main.go"]
outputs = ["k8s-home"]

[tasks.generate-charts]
description = "Generate k8s charts"
depends = "build"
run = "./k8s-home"
outputs = ["dist/*.k8s.yaml"]

# dist/ is gitignored, so a plain git diff never sees it: copy both trees to a
# scratch directory and compare them there. Only the generated branch's
# top-level manifests are taken, as dist/ has no flux-system/. git diff exits
# 1 when the trees differ, which is a result, not a failure.
[tasks.diff]
description = "Diff dist/ against the generated branch"
run = '''
work=$(mktemp -d)
trap 'rm -rf "$work"' EXIT
git fetch -q origin generated
git archive origin/generated -- ':(glob)generated/*.yaml' | tar -x -C "$work"
cp -R dist "$work/dist"
cd "$work" && git diff --no-index -- generated dist || [ $? -eq 1 ]
'''

[tasks.conftest]
description = "Run conftest against generated charts"
depends = ["generate-charts"]
sources = ["dist/*.k8s.yaml"]
run = "conftest test --policy policies --data policies/exemptions.yaml --data policies/policy.yaml ./dist"

[tasks.kustomize-build]
description = "Build dist/ the way Flux builds the generated branch"
depends = ["generate-charts"]
run = "sh contrib/kustomize-build.sh"

[tasks.lint]
description = "Run lint against golang code"
run = "golangci-lint run -c .golangci.yaml"

[tasks.check-versions]
description = "Find outdated helm charts & images"
depends = ["build"]
run = "./k8s-home check-versions $@"

