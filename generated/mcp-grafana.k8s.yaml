apiVersion: v1
kind: Namespace
metadata:
  name: mcp-grafana
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: secretstore-vault
  namespace: mcp-grafana
spec:
  provider:
    vault:
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
      path: secret
      server: http://vault.vault:8200
      version: v2
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-grafana-es-mcp-grafana-c8723b9a
  namespace: mcp-grafana
spec:
  dataFrom:
    - extract:
        conversionStrategy: Default
        key: secret/namespaces/mcp-grafana/mcp-grafana
  refreshInterval: 15m
  secretStoreRef:
    kind: SecretStore
    name: secretstore-vault
  target:
    creationPolicy: Owner
    deletionPolicy: Delete
    immutable: false
    name: mcp-grafana
    template:
      engineVersion: v2
      type: Opaque
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: grafana-community
  namespace: flux-system
spec:
  interval: 1m0s
  url: https://grafana-community.github.io/helm-charts
---
apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    reconcile.fluxcd.io/watch: Enabled
  name: mcp-grafana-helm-val-mcp-grafana-c81b8376
  namespace: mcp-grafana
data:
  values.yaml: |
    # https://github.com/grafana-community/helm-charts/blob/main/charts/grafana-mcp/values.yaml
    # The ExternalSecret and the NetworkPolicy are created in
    # charts/apps/mcp-grafana.go.

    # The chart would name it mcp-grafana-grafana-mcp.
    fullnameOverride: mcp-grafana

    grafana:
      # kube-prometheus-stack's Grafana.
      url: http://prometheus-grafana.monitoring.svc
      # A token of the Grafana service account mcp-grafana, Viewer role.
      apiKeySecret:
        name: mcp-grafana
        key: grafana-token

    disableWrite: true

    # Appended to the image's entrypoint, which sets --transport sse: the last
    # value wins.
    extraArgs:
      - --transport=streamable-http
      # The datasources and features in use here.
      - --enabled-tools=search,datasource,prometheus,loki,tempo,alerting,dashboard,annotations,navigation
      # Requests with another Host header are refused: the URL agent-nexus calls.
      - --allowed-hosts=mcp-grafana.mcp-grafana.svc:8000

    # Callers must send it as a bearer token. Naming the secret keeps the chart
    # from generating its own, which fullnameOverride would also call mcp-grafana:
    # it would clash with the ExternalSecret's.
    serverAuth:
      tokenSecret:
        name: mcp-grafana
        key: server-token

    # It calls Grafana only, never the Kubernetes API.
    automountServiceAccountToken: false
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mcp-grafana
  namespace: mcp-grafana
spec:
  chart:
    spec:
      chart: grafana-mcp
      sourceRef:
        kind: HelmRepository
        name: grafana-community
        namespace: flux-system
      version: 0.30.0
  install:
    createNamespace: false
    skipCRDs: false
  interval: 10m0s
  timeout: 5m0s
  values: {}
  valuesFrom:
    - kind: ConfigMap
      name: mcp-grafana-helm-val-mcp-grafana-c81b8376
      valuesKey: values.yaml
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-grafana
  namespace: mcp-grafana
spec:
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agent-nexus
          podSelector:
            matchLabels:
              app.kubernetes.io/name: agent-nexus
      ports:
        - port: 8000
          protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: mcp-grafana
      app.kubernetes.io/name: grafana-mcp
  policyTypes:
    - Ingress
