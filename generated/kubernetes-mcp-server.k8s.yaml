apiVersion: v1
kind: Namespace
metadata:
  name: kubernetes-mcp-server
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: kubernetes-mcp-server
  namespace: flux-system
spec:
  interval: 1m0s
  type: oci
  url: oci://ghcr.io/containers/charts
---
apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    reconcile.fluxcd.io/watch: Enabled
  name: kubernetes-mcp-server-helm-val-kubernetes-mcp-server-c8afe846
  namespace: kubernetes-mcp-server
data:
  values.yaml: |
    # https://github.com/containers/kubernetes-mcp-server/blob/main/charts/kubernetes-mcp-server/values.yaml
    # The ClusterRole and the NetworkPolicy are created in
    # charts/apps/kubernetes-mcp-server.go.

    image:
      # The chart defaults to latest.
      version: v0.0.67

    # Only agent-nexus calls it, from inside the cluster.
    ingress:
      enabled: false

    # config.toml. The server refuses Secrets on its own too, and only offers
    # read-only tools; helm is left out, as it reads releases from Secrets.
    config:
      read_only: true
      toolsets: [core]
      denied_resources:
        - group: ""
          version: v1
          kind: Secret

    metrics:
      serviceMonitor:
        enabled: true
        labels:
          release: prometheus
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kubernetes-mcp-server
  namespace: kubernetes-mcp-server
spec:
  chart:
    spec:
      chart: kubernetes-mcp-server
      sourceRef:
        kind: HelmRepository
        name: kubernetes-mcp-server
        namespace: flux-system
      version: 0.1.0
  install:
    createNamespace: false
    skipCRDs: false
  interval: 10m0s
  timeout: 5m0s
  values: {}
  valuesFrom:
    - kind: ConfigMap
      name: kubernetes-mcp-server-helm-val-kubernetes-mcp-server-c8afe846
      valuesKey: values.yaml
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: read-all-but-secrets-kubernetes-mcp-server
rules:
  - apiGroups:
      - ""
    resources:
      - componentstatuses
      - configmaps
      - endpoints
      - events
      - limitranges
      - namespaces
      - nodes
      - persistentvolumeclaims
      - persistentvolumes
      - pods
      - pods/log
      - podtemplates
      - replicationcontrollers
      - resourcequotas
      - serviceaccounts
      - services
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - acme.cert-manager.io
      - admissionregistration.k8s.io
      - apiextensions.k8s.io
      - apiregistration.k8s.io
      - apps
      - aquasecurity.github.io
      - autoscaling
      - batch
      - bitnami.com
      - certificates.k8s.io
      - cert-manager.io
      - configuration.konghq.com
      - coordination.k8s.io
      - deuxfleurs.fr
      - discovery.k8s.io
      - events.k8s.io
      - external-secrets.io
      - flowcontrol.apiserver.k8s.io
      - gateway.networking.k8s.io
      - helm.cattle.io
      - helm.toolkit.fluxcd.io
      - hub.traefik.io
      - infra.mkz.me
      - k3s.cattle.io
      - k8s.mkz.me
      - kustomize.toolkit.fluxcd.io
      - kyverno.io
      - longhorn.io
      - metrics.k8s.io
      - mkz.me
      - monitoring.coreos.com
      - monitoring.grafana.com
      - networking.k8s.io
      - node.k8s.io
      - notification.toolkit.fluxcd.io
      - policy
      - postgresql.cnpg.io
      - rbac.authorization.k8s.io
      - resource.k8s.io
      - rollout-operator.grafana.com
      - scheduling.k8s.io
      - scylla.scylladb.com
      - snapshot.storage.k8s.io
      - source.toolkit.fluxcd.io
      - storage.k8s.io
      - traefik.io
      - velero.io
      - wgpolicyk8s.io
    resources:
      - "*"
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: read-all-but-secrets-kubernetes-mcp-server
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: read-all-but-secrets-kubernetes-mcp-server
subjects:
  - kind: ServiceAccount
    name: kubernetes-mcp-server
    namespace: kubernetes-mcp-server
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kubernetes-mcp-server
  namespace: kubernetes-mcp-server
spec:
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agent-nexus
          podSelector:
            matchLabels:
              app.kubernetes.io/name: agent-nexus
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: 8080
          protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: kubernetes-mcp-server
      app.kubernetes.io/name: kubernetes-mcp-server
  policyTypes:
    - Ingress
