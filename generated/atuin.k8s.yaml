apiVersion: v1
kind: Namespace
metadata:
  name: atuin
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: secretstore-vault
  namespace: atuin
spec:
  provider:
    vault:
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
      path: secret
      server: http://vault.vault:8200
      version: v2
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: atuin-es-postgresql-c804e0a8
  namespace: atuin
spec:
  dataFrom:
    - extract:
        conversionStrategy: Default
        key: secret/namespaces/atuin/postgresql
  refreshInterval: 15m
  secretStoreRef:
    kind: SecretStore
    name: secretstore-vault
  target:
    creationPolicy: Owner
    deletionPolicy: Delete
    immutable: false
    name: postgresql
    template:
      engineVersion: v2
      type: Opaque
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atuin-deploy-c8c67a15
  namespace: atuin
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: atuin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: atuin
    spec:
      containers:
        - args:
            - start
          env:
            - name: ATUIN_HOST
              value: 0.0.0.0
            - name: ATUIN_PORT
              value: "8888"
            - name: ATUIN_OPEN_REGISTRATION
              value: "true"
            - name: ATUIN_DB_URI
              valueFrom:
                secretKeyRef:
                  key: url
                  name: postgresql
          image: ghcr.io/atuinsh/atuin:18.24.4
          name: atuin
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: atuin
  name: atuin
  namespace: atuin
spec:
  ports:
    - name: http
      port: 8888
  selector:
    app.kubernetes.io/name: atuin
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  name: atuin
  namespace: atuin
spec:
  ingressClassName: traefik
  rules:
    - host: atuin.services.mkz.me
      http:
        paths:
          - backend:
              service:
                name: atuin
                port:
                  name: http
            path: /
            pathType: Prefix
  tls:
    - hosts:
        - atuin.services.mkz.me
      secretName: secret-tls-www
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: atuin-tailscale
  namespace: atuin
spec:
  defaultBackend:
    service:
      name: atuin
      port:
        number: 8888
  ingressClassName: tailscale
  tls:
    - hosts:
        - atuin
