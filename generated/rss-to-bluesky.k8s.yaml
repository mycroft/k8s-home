apiVersion: v1
kind: Namespace
metadata:
  name: rss-to-bluesky
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: mycroft-ghcr
  namespace: flux-system
spec:
  interval: 1m0s
  type: oci
  url: oci://ghcr.io/mycroft/charts
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: secretstore-vault
  namespace: rss-to-bluesky
spec:
  provider:
    vault:
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
      path: secret
      server: http://vault.vault:8200
      version: v2
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rss-to-bluesky-es-rss-to-bluesky-c8607f05
  namespace: rss-to-bluesky
spec:
  dataFrom:
    - extract:
        conversionStrategy: Default
        key: secret/namespaces/rss-to-bluesky/rss-to-bluesky
  refreshInterval: 15m
  secretStoreRef:
    kind: SecretStore
    name: secretstore-vault
  target:
    creationPolicy: Owner
    deletionPolicy: Delete
    immutable: false
    name: rss-to-bluesky
    template:
      engineVersion: v2
      type: Opaque
---
apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    reconcile.fluxcd.io/watch: Enabled
  name: rss-to-bluesky-helm-val-rss-to-bluesky-c8fc65cf
  namespace: rss-to-bluesky
data:
  values.yaml: |
    # https://github.com/mycroft/rss-to-bluesky/blob/main/charts/rss-to-bluesky/values.yaml

    # Synced from Vault secret/namespaces/rss-to-bluesky/rss-to-bluesky by the
    # ExternalSecret of the same name: bluesky-user and bluesky-password.
    existingSecret: rss-to-bluesky

    schedule: "*/5 * * * *"

    # Suspended until the database from maki (~/bluesky/database/db) is copied
    # into the PVC: an empty database reposts the whole feed. Remove once done.
    suspend: true

    # The bbolt database: the Bluesky session and the GUIDs already posted.
    persistence:
      size: 1Gi
      storageClass: longhorn-crypto-global
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rss-to-bluesky
  namespace: rss-to-bluesky
spec:
  chart:
    spec:
      chart: rss-to-bluesky
      sourceRef:
        kind: HelmRepository
        name: mycroft-ghcr
        namespace: flux-system
      version: 0.1.0
  install:
    createNamespace: false
    skipCRDs: false
  interval: 10m0s
  timeout: 5m0s
  values: {}
  valuesFrom:
    - kind: ConfigMap
      name: rss-to-bluesky-helm-val-rss-to-bluesky-c8fc65cf
      valuesKey: values.yaml
