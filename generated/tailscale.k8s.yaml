apiVersion: v1
kind: Namespace
metadata:
  name: tailscale
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: secretstore-vault
  namespace: tailscale
spec:
  provider:
    vault:
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
      path: secret
      server: http://vault.vault:8200
      version: v2
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tailscale-es-operator-oauth-c8a02600
  namespace: tailscale
spec:
  dataFrom:
    - extract:
        conversionStrategy: Default
        key: secret/namespaces/tailscale/operator-oauth
  refreshInterval: 15m
  secretStoreRef:
    kind: SecretStore
    name: secretstore-vault
  target:
    creationPolicy: Owner
    deletionPolicy: Delete
    immutable: false
    name: operator-oauth
    template:
      engineVersion: v2
      type: Opaque
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: tailscale
  namespace: flux-system
spec:
  interval: 1m0s
  url: https://pkgs.tailscale.com/helmcharts
---
apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    reconcile.fluxcd.io/watch: Enabled
  name: tailscale-helm-val-tailscale-operator-c87c07c3
  namespace: tailscale
data:
  values.yaml: |
    # https://github.com/tailscale/tailscale/blob/main/cmd/k8s-operator/deploy/chart/values.yaml
    #
    # oauth.* stays unset: the credentials come from the operator-oauth Secret,
    # synced from Vault (see charts/infra/tailscale.go).

    # These tags must match the tagOwners of the tailnet policy file
    # (docs/tailscale.md): the operator's OAuth client owns tag:k8s-operator,
    # which in turn owns tag:k8s, the tag every proxy joins the tailnet with.
    operatorConfig:
      defaultTags:
        - "tag:k8s-operator"

    proxyConfig:
      defaultTags: "tag:k8s"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale-operator
  namespace: tailscale
spec:
  chart:
    spec:
      chart: tailscale-operator
      sourceRef:
        kind: HelmRepository
        name: tailscale
        namespace: flux-system
      version: 1.104.2
  install:
    createNamespace: false
    skipCRDs: false
  interval: 10m0s
  timeout: 5m0s
  values: {}
  valuesFrom:
    - kind: ConfigMap
      name: tailscale-helm-val-tailscale-operator-c87c07c3
      valuesKey: values.yaml
