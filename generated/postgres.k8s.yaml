apiVersion: v1
kind: Namespace
metadata:
  name: postgres
---
apiVersion: acid.zalan.do/v1
kind: postgresql
metadata:
  name: postgres-instance
  namespace: postgres
spec:
  databases:
    authentik: authentik-admin
    freshrss: freshrss-admin
    outline: outline-admin
    paperlessngx: paperlessngx-admin
    testaroo: testaroo-admin
  env:
    - name: ALLOW_NOSSL
      value: "1"
  numberOfInstances: 1
  postgresql:
    version: "15"
  teamId: postgres
  users:
    authentik: []
    authentik-admin:
      - superuser
      - createdb
    freshrss: []
    freshrss-admin:
      - superuser
      - createdb
    outline: []
    outline-admin:
      - superuser
      - createdb
    paperlessngx: []
    paperlessngx-admin:
      - superuser
      - createdb
    testaroo: []
    testaroo-admin:
      - superuser
      - createdb
  volume:
    size: 64Gi
    storageClass: longhorn-crypto-global
