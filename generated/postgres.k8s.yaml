apiVersion: v1
kind: Namespace
metadata:
  name: postgres
---
apiVersion: acid.zalan.do/v1
kind: postgresql
metadata:
  name: postgres-instance
  namespace: postgres
spec:
  databases: {}
  env:
    - name: ALLOW_NOSSL
      value: "1"
  numberOfInstances: 1
  postgresql:
    version: "15"
  teamId: postgres
  users: {}
  volume:
    size: 64Gi
    storageClass: longhorn-crypto-global
