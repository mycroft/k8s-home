apiVersion: v1
kind: Namespace
metadata:
  name: agent-nexus
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: secretstore-vault
  namespace: agent-nexus
spec:
  provider:
    vault:
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
      path: secret
      server: http://vault.vault:8200
      version: v2
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agent-nexus-es-agent-nexus-c85a29cd
  namespace: agent-nexus
spec:
  dataFrom:
    - extract:
        conversionStrategy: Default
        key: secret/namespaces/agent-nexus/agent-nexus
  refreshInterval: 15m
  secretStoreRef:
    kind: SecretStore
    name: secretstore-vault
  target:
    creationPolicy: Owner
    deletionPolicy: Delete
    immutable: false
    name: agent-nexus
    template:
      engineVersion: v2
      type: Opaque
---
apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    reconcile.fluxcd.io/watch: Enabled
  name: agent-nexus-helm-val-agent-nexus-c815a711
  namespace: agent-nexus
data:
  values.yaml: |
    # https://git.mkz.me/mycroft/agent-nexus/src/branch/main/charts/agent-nexus/values.yaml
    # The ingress is created in charts/apps/agent-nexus.go.

    # Synced from Vault secret/namespaces/agent-nexus/agent-nexus by the
    # ExternalSecret of the same name.
    existingSecret: agent-nexus

    # llama-server, behind the nginx at llm-api.iop.cx under /llama.cpp/. The
    # bearer token is llm-api-key in the Vault secret.
    llm:
      baseURL: https://llm-api.iop.cx/llama.cpp/v1
      # As listed by /llama.cpp/v1/models.
      model: Swift Uncensored Qwen 3.8
      # Per-slot context (/llama.cpp/props n_ctx), set so startup does not
      # depend on llama-server. Update it if llama-server's -c or --parallel
      # change.
      contextTokens: 196608
      # llama-server runs a single slot.
      concurrency: 1

    gitea:
      enabled: true
      url: https://git.mkz.me
      user: agent-nexus

    allowedOwners:
      - mycroft

    # How reviews are submitted. verdict: approve, comment or request changes;
    # comment (the default for other repositories): a plain comment. A rule
    # naming a repository wins over the repository's own .agent-nexus.yaml.
    review:
      modes:
        - repo: mycroft/k8s-home
          mode: verdict
        - repo: mycroft/agent-nexus
          mode: verdict

    persistence:
      storageClass: longhorn-crypto-global

    serviceMonitor:
      enabled: true
      labels:
        release: prometheus
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: agent-nexus
  namespace: agent-nexus
spec:
  chart:
    spec:
      chart: agent-nexus
      sourceRef:
        kind: HelmRepository
        name: homelab-oci
        namespace: flux-system
      version: 0.1.1
  install:
    createNamespace: false
    skipCRDs: false
  interval: 10m0s
  timeout: 5m0s
  values: {}
  valuesFrom:
    - kind: ConfigMap
      name: agent-nexus-helm-val-agent-nexus-c815a711
      valuesKey: values.yaml
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  name: agent-nexus
  namespace: agent-nexus
spec:
  ingressClassName: traefik
  rules:
    - host: agent-nexus.services.mkz.me
      http:
        paths:
          - backend:
              service:
                name: agent-nexus
                port:
                  name: http
            path: /
            pathType: Prefix
  tls:
    - hosts:
        - agent-nexus.services.mkz.me
      secretName: secret-tls-www
