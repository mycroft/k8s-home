apiVersion: v1
kind: Namespace
metadata:
  name: agent-nexus
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: secretstore-vault
  namespace: agent-nexus
spec:
  provider:
    vault:
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
      path: secret
      server: http://vault.vault:8200
      version: v2
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agent-nexus-es-agent-nexus-c85a29cd
  namespace: agent-nexus
spec:
  dataFrom:
    - extract:
        conversionStrategy: Default
        key: secret/namespaces/agent-nexus/agent-nexus
  refreshInterval: 15m
  secretStoreRef:
    kind: SecretStore
    name: secretstore-vault
  target:
    creationPolicy: Owner
    deletionPolicy: Delete
    immutable: false
    name: agent-nexus
    template:
      engineVersion: v2
      type: Opaque
---
apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    reconcile.fluxcd.io/watch: Enabled
  name: agent-nexus-helm-val-agent-nexus-c815a711
  namespace: agent-nexus
data:
  values.yaml: |
    # https://git.mkz.me/mycroft/agent-nexus/src/branch/main/charts/agent-nexus/values.yaml
    # The ingresses (the API, and the jobs UI behind authentik) and the
    # NetworkPolicy are created in charts/apps/agent-nexus.go.

    # Synced from Vault secret/namespaces/agent-nexus/agent-nexus by the
    # ExternalSecret of the same name.
    existingSecret: agent-nexus

    # llama-server, behind the nginx at llm-api.iop.cx under /llama.cpp/. The
    # bearer token is llm-api-key in the Vault secret.
    llm:
      baseURL: https://llm-api.iop.cx/llama.cpp/v1
      # As listed by /llama.cpp/v1/models.
      model: Swift Uncensored Qwen 3.8
      # Per-slot context (/llama.cpp/props n_ctx), set so startup does not
      # depend on llama-server. Update it if llama-server's -c or --parallel
      # change.
      contextTokens: 196608
      # llama-server runs a single slot.
      concurrency: 1

    # Tool-calling turns per review (chart default 30). Kept below what fits in
    # the 30m jobTimeout: a timeout drops the review, while the turn limit still
    # ends in a written review.
    agentMaxTurns: 24

    gitea:
      enabled: true
      url: https://git.mkz.me
      user: agent-nexus

    # Also the owners whose repositories may be discussed on Zulip.
    allowedOwners:
      - mycroft

    # Answers questions asked on Zulip (chart 0.1.9 and later) to the outgoing
    # webhook bot agent-nexus. Its endpoint URL is the public API ingress,
    # https://agent-nexus.services.mkz.me/v1/events/zulip: Zulip's Smokescreen
    # proxy refuses private addresses, and Traefik is what the NetworkPolicy
    # lets in. Its zuliprc's key and token are zulip-bot-api-key and
    # zulip-webhook-token in the Vault secret; the pod does not start without
    # them.
    zulip:
      enabled: true
      url: https://zulip.services.mkz.me
      # Zulip names a bot <short name>-bot@<host>: the bot's short name is
      # agent-nexus.
      botEmail: agent-nexus-bot@zulip.services.mkz.me

    # MCP servers whose tools the agent may call (chart 0.1.10 and later).
    mcp:
      servers:
        # charts/apps/kubernetes-mcp-server.go: read-only, and its ClusterRole
        # reads everything but Secrets. The NetworkPolicy there admits this pod.
        - name: k8s
          url: http://kubernetes-mcp-server.kubernetes-mcp-server.svc:8080/mcp
          description: the live state of the home Kubernetes cluster, read-only
          # Its read-only tools, but nodes_log and nodes_stats_summary: they go
          # through nodes/proxy, which the ClusterRole does not grant.
          tools:
            - events_list
            - namespaces_list
            - nodes_top
            - pods_get
            - pods_list
            - pods_list_in_namespace
            - pods_log
            - pods_top
            - resources_get
            - resources_list
          # Zulip answers only: PR text could steer what reviews read and post.
          jobs: [chat]

    # How reviews are submitted. verdict: approve, comment or request changes;
    # comment (the default for other repositories): a plain comment. A rule
    # naming a repository wins over the repository's own .agent-nexus.yaml.
    review:
      modes:
        - repo: mycroft/k8s-home
          mode: verdict
        - repo: mycroft/agent-nexus
          mode: verdict

    persistence:
      storageClass: longhorn-crypto-global

    serviceMonitor:
      enabled: true
      labels:
        release: prometheus
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: agent-nexus
  namespace: agent-nexus
spec:
  chart:
    spec:
      chart: agent-nexus
      sourceRef:
        kind: HelmRepository
        name: homelab-oci
        namespace: flux-system
      version: 0.1.10
  install:
    createNamespace: false
    skipCRDs: false
  interval: 10m0s
  timeout: 5m0s
  values: {}
  valuesFrom:
    - kind: ConfigMap
      name: agent-nexus-helm-val-agent-nexus-c815a711
      valuesKey: values.yaml
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  name: agent-nexus
  namespace: agent-nexus
spec:
  ingressClassName: traefik
  rules:
    - host: agent-nexus.services.mkz.me
      http:
        paths:
          - backend:
              service:
                name: agent-nexus
                port:
                  name: http
            path: /
            pathType: Prefix
  tls:
    - hosts:
        - agent-nexus.services.mkz.me
      secretName: secret-tls-www
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: authentik-ak-outpost-outpost-for-agent-nexus@kubernetescrd
  name: agent-nexus-ui
  namespace: agent-nexus
spec:
  ingressClassName: traefik
  rules:
    - host: agent-nexus-ui.services.mkz.me
      http:
        paths:
          - backend:
              service:
                name: agent-nexus
                port:
                  name: ui
            path: /
            pathType: Prefix
  tls:
    - hosts:
        - agent-nexus-ui.services.mkz.me
      secretName: agent-nexus-ui-tls
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-nexus
  namespace: agent-nexus
spec:
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 8080
          protocol: TCP
        - port: 8081
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: 9090
          protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: agent-nexus
      app.kubernetes.io/name: agent-nexus
  policyTypes:
    - Ingress
