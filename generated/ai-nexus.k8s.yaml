apiVersion: v1
kind: Namespace
metadata:
  name: ai-nexus
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: secretstore-vault
  namespace: ai-nexus
spec:
  provider:
    vault:
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
      path: secret
      server: http://vault.vault:8200
      version: v2
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ai-nexus-es-ai-nexus-c80991a1
  namespace: ai-nexus
spec:
  dataFrom:
    - extract:
        conversionStrategy: Default
        key: secret/namespaces/ai-nexus/ai-nexus
  refreshInterval: 15m
  secretStoreRef:
    kind: SecretStore
    name: secretstore-vault
  target:
    creationPolicy: Owner
    deletionPolicy: Delete
    immutable: false
    name: ai-nexus
    template:
      engineVersion: v2
      type: Opaque
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ai-nexus-es-ai-nexus-runner-c84c90e6
  namespace: ai-nexus
spec:
  dataFrom:
    - extract:
        conversionStrategy: Default
        key: secret/namespaces/ai-nexus/ai-nexus-runner
  refreshInterval: 15m
  secretStoreRef:
    kind: SecretStore
    name: secretstore-vault
  target:
    creationPolicy: Owner
    deletionPolicy: Delete
    immutable: false
    name: ai-nexus-runner
    template:
      engineVersion: v2
      type: Opaque
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ai-nexus-es-ai-nexus-tools-c8e930f4
  namespace: ai-nexus
spec:
  dataFrom:
    - extract:
        conversionStrategy: Default
        key: secret/namespaces/ai-nexus/ai-nexus-tools
  refreshInterval: 15m
  secretStoreRef:
    kind: SecretStore
    name: secretstore-vault
  target:
    creationPolicy: Owner
    deletionPolicy: Delete
    immutable: false
    name: ai-nexus-tools
    template:
      engineVersion: v2
      type: Opaque
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ai-nexus-es-postgresql-c86190b8
  namespace: ai-nexus
spec:
  dataFrom:
    - extract:
        conversionStrategy: Default
        key: secret/namespaces/ai-nexus/postgresql
  refreshInterval: 15m
  secretStoreRef:
    kind: SecretStore
    name: secretstore-vault
