apiVersion: v1
kind: Namespace
metadata:
  name: ai-nexus
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: secretstore-vault
  namespace: ai-nexus
spec:
  provider:
    vault:
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
      path: secret
      server: http://vault.vault:8200
      version: v2
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ai-nexus-es-ai-nexus-c80991a1
  namespace: ai-nexus
spec:
  dataFrom:
    - extract:
        conversionStrategy: Default
        key: secret/namespaces/ai-nexus/ai-nexus
  refreshInterval: 15m
  secretStoreRef:
    kind: SecretStore
    name: secretstore-vault
  target:
    creationPolicy: Owner
    deletionPolicy: Delete
    immutable: false
    name: ai-nexus
    template:
      engineVersion: v2
      type: Opaque
---
apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    reconcile.fluxcd.io/watch: Enabled
  name: ai-nexus-helm-val-ai-nexus-c8d92a67
  namespace: ai-nexus
data:
  values.yaml: |
    # https://git.mkz.me/mycroft/ai-nexus/src/branch/main/charts/ai-nexus/values.yaml
    # The ingresses (webhooks, and the dashboard behind authentik) and the
    # NetworkPolicy are created in charts/apps/ai-nexus.go.

    # Synced from Vault secret/namespaces/ai-nexus/ai-nexus by the
    # ExternalSecret of the same name. Each key becomes an environment variable,
    # referenced in config below as ${KEY}.
    existingSecret: ai-nexus

    server:
      # Posted reviews link to their job on the dashboard.
      publicUrl: https://ai-nexus-ui.services.mkz.me
      # llama-server runs a single slot: one job at a time, the others wait in
      # the queue, where waiting does not count against the job timeout.
      workers: 1
      # The slot is shared with agent-nexus, whose jobs can hold it for up to
      # 30 minutes.
      jobTimeoutSecs: 1800

    # config.toml without [server]; see config.example.toml in the ai-nexus
    # repository.
    config: |
      # llama-server, behind the nginx at llm-api.iop.cx under /llama.cpp/.
      [llm.providers.llama]
      kind = "openai"
      base_url = "https://llm-api.iop.cx/llama.cpp/v1"
      api_key = "${LLAMA_API_KEY}"

      [llm.models.qwen]
      provider = "llama"
      # As listed by /llama.cpp/v1/models.
      model = "Swift Uncensored Qwen 3.8"
      # Per-slot context (/llama.cpp/props n_ctx). Update it if llama-server's
      # -c or --parallel change.
      context_tokens = 196608
      max_concurrency = 1

      # Webhooks: https://ai-nexus.services.mkz.me/webhooks/home
      [[forges]]
      name = "home"
      kind = "gitea"
      base_url = "https://git.mkz.me"
      token = "${GITEA_TOKEN}"
      webhook_secret = "${GITEA_WEBHOOK_SECRET}"

      [defaults]
      model = "qwen"
      # Comments only, until the reviews are trusted.
      max_verdict = "comment"

      [[repos]]
      forge = "home"
      name = "mycroft/testaroo"

      [[repos]]
      forge = "home"
      name = "mycroft/ai-nexus"

    persistence:
      storageClass: longhorn-crypto-global

    serviceMonitor:
      enabled: true
      labels:
        release: prometheus
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ai-nexus
  namespace: ai-nexus
spec:
  chart:
    spec:
      chart: ai-nexus
      sourceRef:
        kind: HelmRepository
        name: homelab-oci
        namespace: flux-system
      version: 0.1.1
  install:
    createNamespace: false
    skipCRDs: false
  interval: 10m0s
  timeout: 5m0s
  values: {}
  valuesFrom:
    - kind: ConfigMap
      name: ai-nexus-helm-val-ai-nexus-c8d92a67
      valuesKey: values.yaml
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  name: ai-nexus-webhooks
  namespace: ai-nexus
spec:
  ingressClassName: traefik
  rules:
    - host: ai-nexus.services.mkz.me
      http:
        paths:
          - backend:
              service:
                name: ai-nexus
                port:
                  name: http
            path: /webhooks
            pathType: Prefix
  tls:
    - hosts:
        - ai-nexus.services.mkz.me
      secretName: secret-tls-www
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: authentik-ak-outpost-outpost-for-ai-nexus@kubernetescrd
  name: ai-nexus-ui
  namespace: ai-nexus
spec:
  ingressClassName: traefik
  rules:
    - host: ai-nexus-ui.services.mkz.me
      http:
        paths:
          - backend:
              service:
                name: ai-nexus
                port:
                  name: http
            path: /
            pathType: Prefix
  tls:
    - hosts:
        - ai-nexus-ui.services.mkz.me
      secretName: ai-nexus-ui-tls
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ai-nexus
  namespace: ai-nexus
spec:
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: 8080
          protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: ai-nexus
      app.kubernetes.io/name: ai-nexus
  policyTypes:
    - Ingress
