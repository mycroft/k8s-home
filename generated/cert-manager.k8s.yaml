apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: jetstack
  namespace: flux-system
spec:
  interval: 1m0s
  url: https://charts.jetstack.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    reconcile.fluxcd.io/watch: Enabled
  name: cert-manager-helm-val-cert-manager-c8bc2bb8
  namespace: cert-manager
data:
  values.yaml: |
    # https://github.com/cert-manager/cert-manager/blob/master/deploy/charts/cert-manager/values.yaml

    crds:
      enabled: true

    prometheus:
      enabled: true
      servicemonitor:
        enabled: true
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  chart:
    spec:
      chart: cert-manager
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
      version: v1.21.3
  install:
    createNamespace: false
    skipCRDs: false
  interval: 10m0s
  timeout: 5m0s
  values: {}
  valuesFrom:
    - kind: ConfigMap
      name: cert-manager-helm-val-cert-manager-c8bc2bb8
      valuesKey: values.yaml
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: secretstore-vault
  namespace: cert-manager
spec:
  provider:
    vault:
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
      path: secret
      server: http://vault.vault:8200
      version: v2
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cert-manager-es-rfc2136-tsig-c835e58d
  namespace: cert-manager
spec:
  dataFrom:
    - extract:
        conversionStrategy: Default
        key: secret/namespaces/cert-manager/rfc2136-tsig
  refreshInterval: 15m
  secretStoreRef:
    kind: SecretStore
    name: secretstore-vault
  target:
    creationPolicy: Owner
    deletionPolicy: Delete
    immutable: false
    name: rfc2136-tsig
    template:
      engineVersion: v2
      type: Opaque
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    email: pm+letsencrypt@mkz.me
    privateKeySecretRef:
      name: letsencrypt-staging
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    solvers:
      - dns01:
          rfc2136:
            nameserver: maki.mkz.me:53
            tsigAlgorithm: HMACSHA256
            tsigKeyName: cert-manager
            tsigSecretSecretRef:
              key: secret
              name: rfc2136-tsig
        selector:
          dnsZones:
            - lan.mkz.me
      - http01:
          ingress:
            class: traefik
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    email: pm+letsencrypt@mkz.me
    privateKeySecretRef:
      name: letsencrypt-prod
    server: https://acme-v02.api.letsencrypt.org/directory
    solvers:
      - dns01:
          rfc2136:
            nameserver: maki.mkz.me:53
            tsigAlgorithm: HMACSHA256
            tsigKeyName: cert-manager
            tsigSecretSecretRef:
              key: secret
              name: rfc2136-tsig
        selector:
          dnsZones:
            - lan.mkz.me
      - http01:
          ingress:
            class: traefik
