apiVersion: v1
kind: Namespace
metadata:
  name: velero
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: secretstore-vault
  namespace: velero
spec:
  provider:
    vault:
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
      path: secret
      server: http://vault.vault:8200
      version: v2
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: velero-es-garage-credentials-c89f9b53
  namespace: velero
spec:
  dataFrom:
    - extract:
        conversionStrategy: Default
        key: secret/namespaces/velero/garage-credentials
  refreshInterval: 15m
  secretStoreRef:
    kind: SecretStore
    name: secretstore-vault
  target:
    creationPolicy: Owner
    deletionPolicy: Delete
    immutable: false
    name: garage-credentials
    template:
      engineVersion: v2
      type: Opaque
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: velero-es-velero-repo-credentials-c806dc04
  namespace: velero
spec:
  dataFrom:
    - extract:
        conversionStrategy: Default
        key: secret/namespaces/velero/velero-repo-credentials
  refreshInterval: 15m
  secretStoreRef:
    kind: SecretStore
    name: secretstore-vault
  target:
    creationPolicy: Owner
    deletionPolicy: Delete
    immutable: false
    name: velero-repo-credentials
    template:
      engineVersion: v2
      type: Opaque
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: vmware-tanzu
  namespace: flux-system
spec:
  interval: 1m0s
  url: https://vmware-tanzu.github.io/helm-charts
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: velero-helm-val-velero-c8a297a5
  namespace: velero
data:
  values.yaml: |
    # https://github.com/vmware-tanzu/helm-charts/blob/main/charts/velero/values.yaml

    backupsEnabled: true
    snapshotsEnabled: false
    deployNodeAgent: true

    nodeAgent:
      containerSecurityContext:
        privileged: true

    metrics:
      serviceMonitor:
        enabled: true

    configuration:
      uploaderType: kopia
      defaultVolumesToFsBackup: false
      backupStorageLocation:
        - provider: aws
          default: true
          bucket: velero
          config:
            region: garage
            s3Url: "http://moonstone.lan.mkz.me:3900"
            s3ForcePathStyle: true

    credentials:
      existingSecret: garage-credentials

    initContainers:
      - name: velero-plugin-for-aws
        image: velero/velero-plugin-for-aws:v1.13.1
        imagePullPolicy: IfNotPresent
        volumeMounts:
          - mountPath: /target
            name: plugins

    upgradeJobResources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 100m
        memory: 1024Mi

    kubectl:
      image:
        repository: public.ecr.aws/bitnami/kubectl
        tag: latest
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  annotations:
    configMapHash: b656fb12163a2b4656bf9d1a77cdc29d178db6eaebb9b723f89b896bcb47f5b2
  name: velero
  namespace: velero
spec:
  chart:
    spec:
      chart: velero
      sourceRef:
        kind: HelmRepository
        name: vmware-tanzu
        namespace: flux-system
      version: 12.1.0
  install:
    createNamespace: false
    skipCRDs: false
  interval: 10m0s
  timeout: 5m0s
  values: {}
  valuesFrom:
    - kind: ConfigMap
      name: velero-helm-val-velero-c8a297a5
      valuesKey: values.yaml
---
apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: backup-schedule
  namespace: velero
spec:
  schedule: 30 7 * * *
  template:
    ttl: 720h0m0s
---
apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: filesystem-backup-schedule
  namespace: velero
spec:
  schedule: 30 1 * * *
  template:
    defaultVolumesToFsBackup: true
    includedNamespaces:
      - paperless-ngx
      - calibre-web
    snapshotVolumes: false
    ttl: 720h0m0s
