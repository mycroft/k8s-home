    - name: http
      port: 5672
  selector:
    app.kubernetes.io/component: rabbitmq
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zulip-rabbitmq-sts-c86a0ddf
  namespace: zulip
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: rabbitmq
  serviceName: zulip-rabbitmq-svc-c821ec07
  template:
    metadata:
      labels:
        app.kubernetes.io/component: rabbitmq
    spec:
      containers:
        - env:
            - name: RABBITMQ_DEFAULT_USER
              value: zulip
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  key: password
                  name: rabbitmq
          image: rabbitmq:4.4.0
          name: rabbitmq
          volumeMounts:
            - mountPath: /var/lib/rabbitmq
              name: data
      volumes: []
  volumeClaimTemplates:
    - metadata:
        labels:
          app.kubernetes.io/component: rabbitmq
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
        storageClassName: longhorn-crypto-global
