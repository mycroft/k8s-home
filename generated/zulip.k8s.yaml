apiVersion: v1
kind: Namespace
metadata:
  name: zulip
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: secretstore-vault
  namespace: zulip
spec:
  provider:
    vault:
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
      path: secret
      server: http://vault.vault:8200
      version: v2
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zulip-es-postgresql-c892b15c
  namespace: zulip
spec:
  dataFrom:
    - extract:
        conversionStrategy: Default
        key: secret/namespaces/zulip/postgresql
  refreshInterval: 15m
  secretStoreRef:
    kind: SecretStore
    name: secretstore-vault
  target:
    creationPolicy: Owner
    deletionPolicy: Delete
    immutable: false
    name: postgresql
    template:
      engineVersion: v2
      type: Opaque
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zulip-es-mailrelay-c839940a
  namespace: zulip
spec:
  dataFrom:
    - extract:
        conversionStrategy: Default
        key: secret/namespaces/zulip/mailrelay
  refreshInterval: 15m
  secretStoreRef:
    kind: SecretStore
    name: secretstore-vault
  target:
    creationPolicy: Owner
    deletionPolicy: Delete
    immutable: false
    name: mailrelay
    template:
      engineVersion: v2
      type: Opaque
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zulip-es-oidc-c8ee246f
  namespace: zulip
spec:
  dataFrom:
    - extract:
        conversionStrategy: Default
        key: secret/namespaces/zulip/oidc
  refreshInterval: 15m
  secretStoreRef:
    kind: SecretStore
    name: secretstore-vault
  target:
    creationPolicy: Owner
    deletionPolicy: Delete
    immutable: false
    name: oidc
    template:
      engineVersion: v2
      type: Opaque
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: secret-key
  namespace: zulip
spec:
  allowRepeat: true
  digits: 6
  length: 32
  noUpper: false
  symbols: 0
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: secret-key
  namespace: zulip
spec:
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: secret-key
  refreshInterval: "0"
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    immutable: false
    name: secret-key
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: redis
  name: zulip-redis-svc-c8f33629
  namespace: zulip
spec:
  ports:
    - name: http
      port: 6379
  selector:
    app.kubernetes.io/component: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zulip-redis-sts-c8191e7f
  namespace: zulip
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: redis
  serviceName: zulip-redis-svc-c8f33629
  template:
    metadata:
      labels:
        app.kubernetes.io/component: redis
    spec:
      containers:
        - command:
            - redis-server
            - --save
            - "60"
            - "1"
            - --loglevel
            - warning
          env: []
          image: redis:8.10.3
          name: redis
          volumeMounts:
            - mountPath: /data
              name: data
      volumes: []
  volumeClaimTemplates:
    - metadata:
        labels:
          app.kubernetes.io/component: redis
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
        storageClassName: longhorn-crypto-global
---
