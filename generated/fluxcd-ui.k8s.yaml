apiVersion: v1
kind: Namespace
metadata:
  name: fluxcd-ui
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: mycroft-oci
  namespace: flux-system
spec:
  interval: 1m0s
  type: oci
  url: oci://registry.mkz.me/mycroft/charts
---
apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    reconcile.fluxcd.io/watch: Enabled
  name: fluxcd-ui-helm-val-fluxcd-ui-c88fd385
  namespace: fluxcd-ui
data:
  values.yaml: |
    # https://git.mkz.me/mycroft/fluxcd-ui/src/branch/main/charts/fluxcd-ui/values.yaml
    # The ingress is created in charts/infra/fluxcd-ui.go, behind the authentik
    # outpost that sets the headers below.
    actions:
      enabled: true

    auth:
      userHeader: X-authentik-username
      groupsHeader: X-authentik-groups
      groupsSeparator: "|"
      # Linked next to the user's name. The outpost keeps a user's groups for
      # its session: signing out picks up group changes made in authentik.
      signOutURL: /outpost.goauthentik.io/sign_out

    authorization:
      mode: rbac
      # authentik groups as sent in X-authentik-groups; the chart adds the
      # "fluxcd-ui:" subject prefix.
      bindings:
        - role: operator # suspend, resume, reconcile and inspect Helm releases
          groups: ["Flux Admins"]
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fluxcd-ui
  namespace: fluxcd-ui
spec:
  chart:
    spec:
      chart: fluxcd-ui
      sourceRef:
        kind: HelmRepository
        name: mycroft-oci
        namespace: flux-system
      version: 0.5.0
  install:
    createNamespace: false
    skipCRDs: false
  interval: 10m0s
  timeout: 5m0s
  values: {}
  valuesFrom:
    - kind: ConfigMap
      name: fluxcd-ui-helm-val-fluxcd-ui-c88fd385
      valuesKey: values.yaml
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fluxcd-ui
  namespace: fluxcd-ui
spec:
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 8080
          protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: fluxcd-ui
      app.kubernetes.io/name: fluxcd-ui
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: authentik-ak-outpost-outpost-for-fluxcd-ui@kubernetescrd
  name: fluxcd-ui
  namespace: fluxcd-ui
spec:
  ingressClassName: traefik
  rules:
    - host: flux.services.mkz.me
      http:
        paths:
          - backend:
              service:
                name: fluxcd-ui
                port:
                  name: http
            path: /
            pathType: Prefix
  tls:
    - hosts:
        - flux.services.mkz.me
      secretName: secret-tls-www
