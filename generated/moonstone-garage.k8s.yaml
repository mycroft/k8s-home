apiVersion: v1
kind: Namespace
metadata:
  name: moonstone-garage
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: s3-tls
  namespace: moonstone-garage
spec:
  dnsNames:
    - s3.lan.mkz.me
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-staging
  secretName: s3-tls
