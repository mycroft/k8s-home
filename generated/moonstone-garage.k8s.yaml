apiVersion: v1
kind: Namespace
metadata:
  name: moonstone-garage
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: s3-tls
  namespace: moonstone-garage
spec:
  dnsNames:
    - s3.lan.mkz.me
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod
  secretName: s3-tls
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: moonstone
  namespace: moonstone-garage
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: s3-tls-reader
  namespace: moonstone-garage
rules:
  - apiGroups:
      - ""
    resourceNames:
      - s3-tls
    resources:
      - secrets
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: s3-tls-reader
  namespace: moonstone-garage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: s3-tls-reader
subjects:
  - kind: ServiceAccount
    name: moonstone
    namespace: moonstone-garage
---
apiVersion: v1
kind: Secret
metadata:
  annotations:
    kubernetes.io/service-account.name: moonstone
  name: moonstone-token
  namespace: moonstone-garage
type: kubernetes.io/service-account-token
