apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-dumps
  namespace: cnpg
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: longhorn-crypto-global
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-dump
  namespace: cnpg
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          annotations:
            backup.velero.io/backup-volumes: backup
          labels:
            app.kubernetes.io/name: postgres-dump
        spec:
          containers:
            - command:
                - /bin/sh
                - -c
                - |-
                  set -eu
                  umask 077
                  timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
                  temporary="/backup/.${timestamp}.tmp"
                  destination="/backup/${timestamp}"
                  trap 'rm -rf "${temporary}"' EXIT
                  mkdir "${temporary}"
                  pg_dumpall --globals-only --file="${temporary}/globals.sql"
                  psql --dbname=postgres --tuples-only --no-align --command="SELECT datname FROM pg_database WHERE datallowconn AND NOT datistemplate ORDER BY datname" > "${temporary}/databases"
                  while IFS= read -r database; do
                    pg_dump --format=custom --dbname="${database}" --file="${temporary}/${database}.dump"
                  done < "${temporary}/databases"
                  rm "${temporary}/databases"
                  mv "${temporary}" "${destination}"
                  trap - EXIT
                  ln -sfn "${timestamp}" /backup/latest
                  find /backup -mindepth 1 -maxdepth 1 -type d -mtime +30 -exec rm -rf {} +
                  # Keep the PVC mounted while Velero's scheduled filesystem backup runs.
                  sleep 8h
              env:
                - name: PGHOST
                  value: postgres-rw.cnpg
                - name: PGPORT
                  value: "5432"
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      key: username
                      name: postgres-app
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      key: password
                      name: postgres-app
              image: ghcr.io/cloudnative-pg/postgresql:18.3-system-trixie
              name: postgres-dump
              volumeMounts:
                - mountPath: /backup
                  name: backup
          restartPolicy: Never
          securityContext:
            fsGroup: 26
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: postgres-dumps
  schedule: 30 0 * * *
  successfulJobsHistoryLimit: 1
