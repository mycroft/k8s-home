apiVersion: v1
kind: Namespace
metadata:
  name: trivy-system
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: aquasecurity
  namespace: flux-system
spec:
  interval: 1m0s
  url: https://aquasecurity.github.io/helm-charts/
---
apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    reconcile.fluxcd.io/watch: Enabled
  name: trivy-helm-val-trivy-operator-c88a521d
  namespace: trivy-system
data:
  values.yaml: |
    # https://github.com/aquasecurity/helm-charts/blob/main/charts/trivy-operator/values.yaml

    operator:
      # Reports expire after this long and the workload is rescanned. The chart's
      # 24h rescanned every image daily, which is what got trivy disabled in 2023.
      # Image changes still trigger a scan straight away.
      scannerReportTTL: "168h"
      scanJobsConcurrentLimit: 1
      # A single Trivy server holds the vulnerability DB; scan jobs run as thin
      # clients instead of each downloading and unpacking the DB.
      builtInTrivyServer: true
      # Node-collector jobs, a compliance run every 6h, and a secret scan of every
      # file in every image.
      infraAssessmentScannerEnabled: false
      clusterComplianceEnabled: false
      exposedSecretScannerEnabled: false

    # The operator reads its trivy-operator ConfigMap (where trivyOperator.*
    # lands) only at startup, and the chart only rolls the pod when the separate
    # trivy-operator-config changes. Roll it on any edit to this file.
    podAnnotations:
      values-hash: "d64a811fbcdaf4f6668d95c59dd134a11addee227f9851ff94d812ef006c3760"

    trivyOperator:
      # Velero creates a maintenance Job per backup repository, ~114 a day, each
      # scanned as a new workload. The Velero Deployment lacks the label and is
      # still scanned.
      skipResourceByLabels: "velero.io/repo-name"

    # Prometheus picks up ServiceMonitors from every namespace.
    serviceMonitor:
      enabled: true

    trivy:
      ignoreUnfixed: true
      # The server's DB is a cache: emptyDir rather than a Longhorn volume.
      storageClassEnabled: false
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trivy-operator
  namespace: trivy-system
spec:
  chart:
    spec:
      chart: trivy-operator
      sourceRef:
        kind: HelmRepository
        name: aquasecurity
        namespace: flux-system
      version: 0.38.1
  install:
    crds: CreateReplace
    createNamespace: false
    skipCRDs: false
  interval: 10m0s
  timeout: 5m0s
  upgrade:
    crds: CreateReplace
  values: {}
  valuesFrom:
    - kind: ConfigMap
      name: trivy-helm-val-trivy-operator-c88a521d
      valuesKey: values.yaml
---
