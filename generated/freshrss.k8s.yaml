apiVersion: v1
kind: Namespace
metadata:
  name: freshrss
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: secretstore-vault
  namespace: freshrss
spec:
  provider:
    vault:
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
      path: secret
      server: http://vault.vault:8200
      version: v2
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: freshrss-es-postgresql-cnpg-c860c2b4
  namespace: freshrss
spec:
  dataFrom:
    - extract:
        conversionStrategy: Default
        key: secret/namespaces/freshrss/postgresql-cnpg
  refreshInterval: 15m
  secretStoreRef:
    kind: SecretStore
    name: secretstore-vault
  target:
    creationPolicy: Owner
    deletionPolicy: Delete
    immutable: false
    name: postgresql-cnpg
    template:
      engineVersion: v2
      type: Opaque
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: freshrss
  name: freshrss-freshrss-svc-c8dfddbc
  namespace: freshrss
spec:
  ports:
    - name: http
      port: 80
  selector:
    app.kubernetes.io/name: freshrss
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: freshrss-freshrss-sts-c88554ab
  namespace: freshrss
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: freshrss
  serviceName: freshrss-freshrss-svc-c8dfddbc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: freshrss
    spec:
      containers:
        - env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: Etc/UTC
            - name: FRESHRSS_DB_HOST
              valueFrom:
                secretKeyRef:
                  key: host
                  name: postgresql-cnpg
            - name: FRESHRSS_DB_USER
              valueFrom:
                secretKeyRef:
                  key: username
                  name: postgresql-cnpg
            - name: FRESHRSS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: postgresql-cnpg
            - name: FRESHRSS_DB_NAME
              valueFrom:
                secretKeyRef:
                  key: dbname
                  name: postgresql-cnpg
          image: freshrss/freshrss:1.29.1
          name: freshrss
          volumeMounts:
            - mountPath: /var/www/FreshRSS/data
              name: data
            - mountPath: /var/www/FreshRSS/extensions
              name: extensions
      securityContext:
        fsGroup: 0
      volumes: []
  volumeClaimTemplates:
    - metadata:
        labels:
          app.kubernetes.io/name: freshrss
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
        storageClassName: longhorn-crypto-global
    - metadata:
        labels:
          app.kubernetes.io/name: freshrss
        name: extensions
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
        storageClassName: longhorn-crypto-global
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: freshrss-cronjob-c8609a6c
  namespace: freshrss
spec:
  jobTemplate:
    metadata:
      namespace: freshrss
    spec:
      template:
        metadata:
          namespace: freshrss
        spec:
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchExpressions:
                      - key: statefulset.kubernetes.io/pod-name
                        operator: In
                        values:
                          - freshrss-freshrss-sts-c88554ab-0
                  topologyKey: kubernetes.io/hostname
          containers:
            - command:
                - /var/www/FreshRSS/app/actualize_script.php
              env:
                - name: PUID
                  value: "1000"
                - name: PGID
                  value: "1000"
                - name: TZ
                  value: Etc/UTC
                - name: FRESHRSS_DB_HOST
                  valueFrom:
                    secretKeyRef:
                      key: host
                      name: postgresql-cnpg
                - name: FRESHRSS_DB_USER
                  valueFrom:
                    secretKeyRef:
                      key: username
                      name: postgresql-cnpg
                - name: FRESHRSS_DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      key: password
                      name: postgresql-cnpg
                - name: FRESHRSS_DB_NAME
                  valueFrom:
                    secretKeyRef:
                      key: dbname
                      name: postgresql-cnpg
              image: freshrss/freshrss:1.29.1
              name: updater
              volumeMounts:
                - mountPath: /var/www/FreshRSS/data
                  name: data
          restartPolicy: Never
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: data-freshrss-freshrss-sts-c88554ab-0
  schedule: 12,42 * * * *
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  name: freshrss-ingress-c8de4878
  namespace: freshrss
spec:
  ingressClassName: traefik
  rules:
    - host: freshrss.services.mkz.me
      http:
        paths:
          - backend:
              service:
                name: freshrss-freshrss-svc-c8dfddbc
                port:
                  name: http
            path: /
            pathType: Prefix
  tls:
    - hosts:
        - freshrss.services.mkz.me
      secretName: secret-tls-www
