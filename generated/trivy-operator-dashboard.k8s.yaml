apiVersion: v1
kind: Namespace
metadata:
  name: trivy-operator-dashboard
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: raoulx24
  namespace: flux-system
spec:
  interval: 1m0s
  type: oci
  url: oci://ghcr.io/raoulx24/charts
---
apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    reconcile.fluxcd.io/watch: Enabled
  name: trivy-operator-dashb-helm-val-trivy-operator-dashboard-c881788f
  namespace: trivy-operator-dashboard
data:
  values.yaml: |
    # https://github.com/raoulx24/trivy-operator-dashboard/blob/main/deploy/helm/trivy-operator-dashboard/values.yaml

    kubernetes:
      # trivy-operator runs with these scanners off (configs/trivy-operator.yaml.tmpl):
      # hide their pages rather than show them empty.
      trivyUseClusterComplianceReport: false
      trivyUseClusterInfraAssessmentReport: false
      trivyUseInfraAssessmentReport: false
      trivyUseExposedSecretReport: false

    # Report history needs a valkey sidecar on a PVC whose default storage class
    # (managed-csi-premium) does not exist here. The dashboard works without it.
    history:
      enabled: false

    # Updates come through check-versions, like every other chart.
    gitHub:
      serverCheckForUpdates: false

    # The ingress, with authentik forward auth, is created in
    # charts/security/trivy-operator-dashboard.go.
    ingress:
      enabled: false

    # The chart's advised values.
    resources:
      requests:
        cpu: 100m
        memory: 384Mi
      limits:
        cpu: 1000m
        memory: 384Mi
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trivy-operator-dashboard
  namespace: trivy-operator-dashboard
spec:
  chart:
    spec:
      chart: trivy-operator-dashboard
      sourceRef:
        kind: HelmRepository
        name: raoulx24
        namespace: flux-system
      version: 1.9.0
  install:
    createNamespace: false
    skipCRDs: false
  interval: 10m0s
  timeout: 5m0s
  values: {}
  valuesFrom:
    - kind: ConfigMap
      name: trivy-operator-dashb-helm-val-trivy-operator-dashboard-c881788f
      valuesKey: values.yaml
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: trivy-operator-dashboard
  namespace: trivy-operator-dashboard
spec:
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 8900
          protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: trivy-operator-dashboard
      app.kubernetes.io/name: trivy-operator-dashboard
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: authentik-ak-outpost-outpost-for-trivy-operator-dashboard@kubernetescrd
  name: trivy-operator-dashboard
  namespace: trivy-operator-dashboard
spec:
  ingressClassName: traefik
  rules:
    - host: trivy.services.mkz.me
      http:
        paths:
          - backend:
              service:
                name: trivy-operator-dashboard
                port:
                  name: http
            path: /
            pathType: Prefix
  tls:
    - hosts:
        - trivy.services.mkz.me
      secretName: secret-tls-www
