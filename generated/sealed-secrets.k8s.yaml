apiVersion: v1
kind: Namespace
metadata:
  name: sealed-secrets
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: sealed-secrets
  namespace: flux-system
spec:
  interval: 1m0s
  url: https://bitnami.github.io/sealed-secrets
---
apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    reconcile.fluxcd.io/watch: Enabled
  name: sealed-secrets-helm-val-sealed-secrets-c8cfe4e4
  namespace: sealed-secrets
data:
  values.yaml: |
    # https://github.com/bitnami-labs/sealed-secrets/blob/main/helm/sealed-secrets/values.yaml

    namespace: sealed-secrets

    metrics:
      serviceMonitor:
        enabled: true
---
apiVersion: helm.toolkit.fluxcd.io/v2
