    spec:
      chart: sealed-secrets
      sourceRef:
        kind: HelmRepository
        name: sealed-secrets
        namespace: flux-system
      version: 2.20.0
  install:
    createNamespace: false
    skipCRDs: false
  interval: 10m0s
