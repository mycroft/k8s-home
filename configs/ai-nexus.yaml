# https://git.mkz.me/mycroft/ai-nexus/src/branch/main/charts/ai-nexus/values.yaml
# The ingresses (webhooks, and the dashboard behind authentik) and the
# NetworkPolicy are created in charts/apps/ai-nexus.go.

# Synced from Vault secret/namespaces/ai-nexus/ai-nexus by the
# ExternalSecret of the same name. Each key becomes an environment variable,
# referenced in config below as ${KEY}.
existingSecret: ai-nexus

server:
  # Posted reviews link to their job on the dashboard.
  publicUrl: https://ai-nexus-ui.services.mkz.me
  # llama-server runs a single slot: one job at a time, the others wait in
  # the queue, where waiting does not count against the job timeout.
  workers: 1
  # The slot is shared with agent-nexus, whose jobs can hold it for up to
  # 30 minutes. A job on runners waits for all its passes within it: three
  # skills on two runners take two rounds of up to runners.passTimeoutSecs.
  jobTimeoutSecs: 3600
  # The ai_nexus database on the CNPG cluster (ADR-0018 of ai-nexus), its
  # records copied from SQLite with `ai-nexus copy-database`.
  databaseUrl: "${DATABASE_URL}"

# From the postgresql Secret, synced from Vault's
# secret/namespaces/ai-nexus/postgresql, where the CNPG cluster's chart pushes
# the database's credentials (charts/storage/cnpg-cluster.go).
extraEnv:
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: postgresql
        key: url

# Runners run the review passes of repositories with engine = "claude-code"
# in Claude Code (ADR-0016), with CLAUDE_CODE_OAUTH_TOKEN from Vault's
# secret/namespaces/ai-nexus/ai-nexus-runner (see charts/apps/ai-nexus.go).
# They share the subscription's usage limits with interactive use.
runners:
  enabled: true
  replicas: 2
  existingSecret: ai-nexus-runner
  passTimeoutSecs: 900
  # Runner pools (ADR-0021 of ai-nexus) run the change jobs of repositories
  # naming them with `pool`, with the pool's toolchain; the review runners
  # above never get them. They share the runners' Claude credential.
  pools:
    - name: rust
      replicas: 1
      image:
        repository: registry.mkz.me/mycroft/ai-nexus-runner-rust
      # Change jobs run up to 45 minutes; jobTimeoutSecs stays above.
      passTimeoutSecs: 2700
      # The pass's repository, CARGO_HOME and target/ live in /tmp.
      tmpSizeLimit: 20Gi
      resources:
        requests:
          cpu: 500m
          memory: 1Gi
        limits:
          memory: 8Gi

# The tools service (ADR-0017): the web tools of the passes on the runners.
# From Vault's secret/namespaces/ai-nexus/ai-nexus-tools, it reads
# git.mkz.me with GITEA_TOKEN, a token that can only read, and GitHub as the
# ai-nexus-bot app with GITHUB_APP_PRIVATE_KEY, asking for installation
# tokens that only read contents. It checks grants with the public half of
# AI_NEXUS_GRANT_KEY.
tools:
  enabled: true
  existingSecret: ai-nexus-tools
  grantPublicKey: |
    -----BEGIN PUBLIC KEY-----
    MCowBQYDK2VwAyEA4+0M8GfkeggDvkEKt+W3CbfOlfqYpaiY81ELloBJEZA=
    -----END PUBLIC KEY-----
  config: |
    [[forges]]
    name = "home"
    kind = "gitea"
    base_url = "https://git.mkz.me"
    token = "${GITEA_TOKEN}"

    [[forges]]
    name = "github"
    kind = "github"
    base_url = "https://api.github.com"
    app = { id = 5838680, private_key = "${GITHUB_APP_PRIVATE_KEY}" }

# config.toml without [server]; see config.example.toml in the ai-nexus
# repository.
config: |
  # llama-server, behind the nginx at llm-api.iop.cx under /llama.cpp/.
  [llm.providers.llama]
  kind = "openai"
  base_url = "https://llm-api.iop.cx/llama.cpp/v1"
  api_key = "${LLAMA_API_KEY}"

  [llm.models.qwen]
  provider = "llama"
  # As listed by /llama.cpp/v1/models.
  model = "Swift Uncensored Qwen 3.8"
  # Per-slot context (/llama.cpp/props n_ctx). Update it if llama-server's
  # -c or --parallel change.
  context_tokens = 196608
  max_concurrency = 1

  # Webhooks: https://ai-nexus.services.mkz.me/webhooks/home
  [[forges]]
  name = "home"
  kind = "gitea"
  base_url = "https://git.mkz.me"
  token = "${GITEA_TOKEN}"
  # The coder bot (ADR-0020 of ai-nexus): the ai-nexus-coder account, a
  # collaborator with write access on the repositories with change jobs.
  coder = { token = "${GITEA_CODER_TOKEN}" }
  webhook_secret = "${GITEA_WEBHOOK_SECRET}"

  # Webhooks: https://ai-nexus.services.mkz.me/webhooks/github, set in the
  # GitHub App's settings. Reviews are posted as the app's bot; the app must
  # be installed on each repository below.
  [[forges]]
  name = "github"
  kind = "github"
  base_url = "https://api.github.com"
  app = { id = 5838680, private_key = "${GITHUB_APP_PRIVATE_KEY}" }
  # The coder bot: the ai-nexus-coder-bot app, without webhook or Workflows
  # permission, installed on the repositories with change jobs.
  coder = { app = { id = 5883964, private_key = "${GITHUB_CODER_APP_PRIVATE_KEY}" } }
  webhook_secret = "${GITHUB_WEBHOOK_SECRET}"

  [defaults]
  model = "qwen"
  # Comments only by default; a repository whose reviews are trusted raises
  # its own max_verdict (k8s-home below approves and auto-merges).
  max_verdict = "comment"

  # Sandboxes: agentic review (ADR-0013) explores the pull request's head
  # with read-only tools before answering.
  [[repos]]
  forge = "home"
  name = "mycroft/testaroo"
  agentic = true

  # Reviewed in Claude Code on the runners: large pull requests included,
  # every built-in tool on (Bash and WebFetch too).
  [[repos]]
  forge = "home"
  name = "mycroft/ai-nexus"
  engine = "claude-code"
  # Passes took 3 to 10 turns (14 passes, PostgreSQL support included);
  # 30 stops a runaway session well before the default 100.
  claude_max_turns = 30

  [[repos]]
  forge = "github"
  name = "mycroft/testaroo"
  agentic = true

  # GitHub repositories, reviewed in Claude Code on the runners with the
  # web tools from the tools service. Their skills are in each repository's
  # .ai-nexus/skills/. Comments only (the default max_verdict) until their
  # reviews are trusted; auto_merge can follow, the app may merge.

  # AI command-line client, Rust.
  [[repos]]
  forge = "github"
  name = "mycroft/aika-rs"
  engine = "claude-code"
  claude_max_turns = 30
  agentic = true
  web_tools = true

  # TOTP/HOTP secrets store, Rust.
  [[repos]]
  forge = "github"
  name = "mycroft/otp"
  engine = "claude-code"
  claude_max_turns = 30
  agentic = true
  web_tools = true

  # Bitcoin chainstate parser, Rust.
  [[repos]]
  forge = "github"
  name = "mycroft/rs-chainstate"
  engine = "claude-code"
  claude_max_turns = 30
  agentic = true
  web_tools = true
  # The first GitHub repository merged on approval (ADR-0014 of
  # ai-nexus): the app needs Contents write, Checks and Commit statuses.
  max_verdict = "approve"
  auto_merge = "rebase"

  # OpenAI client, Go.
  [[repos]]
  forge = "github"
  name = "mycroft/asoai"
  engine = "claude-code"
  claude_max_turns = 30
  agentic = true
  web_tools = true

  # This repository. Its skills are in .ai-nexus/skills/: `manifests` for
  # the Go charts and Helm values, `versions` for versions.yaml, which no CI
  # job checks. Pull requests touching neither are skipped without a comment.
  # Verdicts: approve without findings, comment on minor ones or when a pass
  # skipped something, request changes on major and critical ones. Approved
  # pull requests are rebased onto main once their checks pass (ADR-0014).
  [[repos]]
  forge = "home"
  name = "mycroft/k8s-home"
  # Reviewed in Claude Code on the runners, with the web tools from the
  # tools service (ADR-0016, ADR-0017).
  engine = "claude-code"
  # Passes took 5 to 6 turns (6 passes, web tools included); 30 stops a
  # runaway session well before the default 100.
  claude_max_turns = 30
  agentic = true
  # Passes read the chart versions, release notes, pages and source
  # repositories a change moves to, when the base branch references them
  # (ADR-0015).
  web_tools = true
  ignore = ["go.sum", "mise.lock", ".mise/**", "crds/**"]
  max_verdict = "approve"
  request_changes_at = "major"
  auto_merge = "rebase"

# No volume since the move to PostgreSQL: the chart keeps the ai-nexus-data
# claim, which holds the last SQLite database, ai-nexus.db.
persistence:
  storageClass: longhorn-crypto-global

serviceMonitor:
  enabled: true
  labels:
    release: prometheus
