# https://git.mkz.me/mycroft/reviews/src/branch/main/charts/reviews/values.yaml
# The ingress and the NetworkPolicy are created in charts/apps/reviews.go.

baseURL: https://reviews.iop.cx

github:
  # Client ID of the GitHub OAuth App whose callback URL is
  # https://reviews.iop.cx/auth/callback. Its client secret is
  # github-client-secret in the Vault secret.
  clientID: Ov23liBG8Gtc5dOmnSHQ

# Synced from Vault secret/namespaces/reviews/reviews by the ExternalSecret
# of the same name: github-client-secret, and session-key (32 random bytes,
# base64; changing it signs everyone out).
existingSecret: reviews

# Users' settings (ignore patterns, pages turned off) are kept in a SQLite
# database at /data/reviews.db on this PVC, so they follow users across
# browsers, instead of in each browser's cookie. Settings already in a cookie
# still apply until the user saves, which moves them to the database. With
# persistence, the chart runs a single replica with the Recreate strategy.
persistence:
  enabled: true
  size: 1Gi
  storageClass: longhorn-crypto-global
