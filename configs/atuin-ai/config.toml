# Atuin AI server, mounted at /etc/atuin-ai/config.toml by charts/apps/atuin-ai.go.
# Reference: https://github.com/atuinsh/atuin-ai-server#configuration
#
# Secrets stay out of this file: the API key is read from the environment, and
# AUTH_TOKEN, which clients send as their ai.api_token, is set on the pod.

port = 8080

# LiteLLM (charts/apps/litellm.go), through its in-cluster service. The server
# appends /chat/completions.
endpoint = "http://litellm.litellm:4000/v1"
api_key = { env = "LITELLM_API_KEY" }

default_model = "qwen"

[request.body]
stream_options = { include_usage = true }

# model is a model_name from configs/litellm/config.yaml, which picks the
# backend: qwen is moonstone's llama-server, openai/<model> is OpenAI. Every
# model must support tool calling, which on llama-server needs --jinja.
[[models]]
alias = "qwen"
name = "Swift Qwen3.8 27B"
description = "Qwen3.8 27B (uncensored fine-tune) on moonstone's llama-server, through LiteLLM"
model = "qwen"

[[models]]
alias = "gpt-5-mini"            # what /model shows and selects
name = "GPT-5 mini"
description = "OpenAI, through LiteLLM"
model = "openai/gpt-5-mini"     # LiteLLM's openai/* route forwards this to OpenAI
